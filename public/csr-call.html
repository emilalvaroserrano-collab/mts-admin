<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b101b" />
  <title>Call Sarah</title>
  <style>
    :root { color-scheme: dark; --bg:#080d16; --ink:#f1f5fa; --muted:#91a0b2; --gold:#eac476; --good:#52d8a5; --red:#ed6b77; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -10%, #25324d 0%, transparent 42%), var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    a { color: inherit; text-decoration: none; }
    .screen { min-height: 100vh; max-width: 460px; margin: 0 auto; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .kicker { font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: #7e91a8; text-transform: uppercase; }
    .pill { display: flex; align-items: center; gap: 8px; border: 1px solid #41503c; background: #202b25; padding: 7px 12px; border-radius: 100px; color: #c1e3bb; font-size: 11px; font-weight: 750; }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.connecting { color: #f7d892; background: #392f23; border-color: #6b573b; }
    .pill.active { color: #a9f3d9; background: #163229; border-color: #356753; }
    .pill.error { color: #ffbbc2; background: #3b222b; border-color: #74424a; }
    .portrait-wrap { position: relative; display: grid; place-items: center; width: 196px; height: 196px; margin: 22px auto 6px; }
    .portrait-wrap:before, .portrait-wrap:after { content: ""; position: absolute; inset: 9px; border: 1px solid #8c754339; border-radius: 50%; }
    .portrait-wrap:after { inset: 0; border-color: #d8ad5435; border-style: dashed; }
    .portrait-wrap.talking:before { animation: ripple 1.8s ease-in-out infinite; }
    .portrait { position: relative; display: grid; place-items: center; width: 143px; height: 143px; border: 4px solid #273447; border-radius: 50%; background: radial-gradient(circle at 37% 26%, #52647b, #253448 45%, #152131 76%); box-shadow: 0 20px 45px #0005; }
    .initial { font-size: 62px; font-weight: 750; letter-spacing: -4px; color: #f5d49a; }
    .spark { position: absolute; right: -3px; bottom: 12px; width: 29px; height: 29px; border: 4px solid #172230; border-radius: 50%; background: #52d8a5; }
    h1 { margin: 8px 0 2px; text-align: center; font-size: 28px; letter-spacing: -.4px; }
    .role { margin: 0; text-align: center; color: #9bacc1; font-size: 13px; }
    .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 42px; margin: 16px 0 8px; }
    .wave span { height: calc(var(--h) * 1px); width: 4px; border-radius: 7px; background: linear-gradient(#ffe8b9, #d5a75a); opacity: .35; transform: scaleY(.25); }
    .wave.active span { animation: equalize var(--dur, 1.1s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s); opacity: .95; }
    .log { min-height: 88px; max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 8px; }
    .line { font-size: 13px; color: #c5d0dc; }
    .line b { display: block; font-size: 10px; letter-spacing: .4px; color: #8ea0b3; font-weight: 750; }
    .line.you { text-align: right; }
    .line.you b { color: #d7c392; }
    .line.partial { opacity: .6; }
    .empty { margin: 12px 0; text-align: center; color: #7d8fa1; font-size: 12px; }
    .status { margin: 6px 0 0; text-align: center; color: #c2d0dc; font-weight: 650; }
    .timer { margin: 4px 0 12px; text-align: center; font-size: 34px; letter-spacing: 2px; font-variant-numeric: tabular-nums; font-weight: 520; }
    .controls { display: flex; justify-content: center; gap: 28px; }
    .control { display: grid; justify-items: center; gap: 8px; border: 0; background: none; color: #9dabbe; font-size: 11px; }
    .control span.icon { display: grid; place-items: center; width: 55px; height: 55px; background: #202d3d; border: 1px solid #324355; border-radius: 50%; color: #e3ebf3; font-size: 18px; }
    .control.on span.icon { background: #573441; border-color: #e68192; }
    .volume { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto; max-width: 280px; color: #97a8b8; font-size: 12px; }
    .volume input { width: 140px; accent-color: var(--gold); }
    .call { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; margin-top: auto; border: 0; border-radius: 14px; background: linear-gradient(110deg, #e7bf73, #f5d899); color: #18212b; font-weight: 800; }
    .call.hang { background: linear-gradient(110deg, #d95767, #f07982); color: white; }
    .error { min-height: 16px; margin: 8px 0 0; text-align: center; color: #f3999f; font-size: 12px; }
    .back { position: absolute; width: 1px; height: 1px; overflow: hidden; }
    @keyframes equalize { 0% { transform: scaleY(.25); } 50% { transform: scaleY(.9); } 100% { transform: scaleY(.4); } }
    @keyframes ripple { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.08); opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top">
      <a class="kicker" href="/portal">MTS · Live call</a>
      <span class="pill" id="pill"><span class="dot"></span><span id="pillText">Ready to call</span></span>
    </div>
    <div class="portrait-wrap" id="portrait"><div class="portrait"><span class="initial">S</span><span class="spark"></span></div></div>
    <h1>Sarah</h1>
    <p class="role" id="who">Manage Tech Service · Customer Support</p>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <div class="log" id="log" role="log" aria-live="polite"><p class="empty">Captions appear here.</p></div>
    <p class="status" id="status">Your assistant is ready</p>
    <p class="timer" id="timer">00:00</p>
    <div class="controls">
      <button class="control" id="muteBtn" type="button" disabled><span class="icon" id="muteIcon">Mic</span><span id="muteText">Mute mic</span></button>
      <button class="control" id="speakerBtn" type="button" disabled><span class="icon" id="speakerIcon">Vol</span><span id="speakerText">Audio on</span></button>
    </div>
    <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="85" aria-label="Playback volume" /> <span id="volumeText">85%</span></label>
    <button class="call" id="callBtn" type="button">Start voice call</button>
    <p class="error" id="error" role="alert"></p>
  </div>
  <script type="module">
    const PUBLIC_KEY = "45edcec0-452b-4b49-9412-2bb1216c3a53";
    const ASSISTANT_ID = "33c873a2-445e-45ef-b134-46cc68be4471";
    const $ = (id) => document.getElementById(id);
    const pages = { home:"/portal", tickets:"/portal/tickets", "new-ticket":"/portal/tickets/new", shop:"/portal/shop", orders:"/portal/orders", billing:"/portal/billing", complaints:"/portal/complaints", organization:"/portal/organization", account:"/portal/account", services:"/portal/my-services", quotes:"/portal/quotes", notifications:"/portal/notifications" };
    const state = { client:null, mode:"idle", muted:false, speakerOff:false, volume:0.85, startedAt:null, timer:null, lines:[], partials:new Map() };
    const wave = $("wave");
    const heights = [8,14,10,22,16,28,12,20,9,18];
    heights.forEach((h, i) => {
      const bar = document.createElement("span");
      bar.style.setProperty("--h", h);
      bar.style.setProperty("--delay", (-i * 0.08) + "s");
      bar.style.setProperty("--dur", (0.7 + (i % 4) * 0.15) + "s");
      wave.append(bar);
    });

    function clip(value, max) { return typeof value === "string" ? value.slice(0, max) : ""; }
    function paint() {
      const live = state.mode === "active" || state.mode === "connecting" || state.mode === "ending";
      const labels = { idle:"Ready to call", connecting:"Connecting", active:"On call", ending:"Ending", error:"Call failed" };
      $("pillText").textContent = labels[state.mode];
      $("pill").className = "pill" + (state.mode === "active" ? " active" : state.mode === "connecting" || state.mode === "ending" ? " connecting" : state.mode === "error" ? " error" : "");
      $("callBtn").textContent = state.mode === "active" ? "End call" : state.mode === "connecting" ? "Cancel" : "Start voice call";
      $("callBtn").classList.toggle("hang", live);
      $("callBtn").disabled = state.mode === "ending";
      $("muteBtn").disabled = state.mode !== "active";
      $("speakerBtn").disabled = state.mode !== "active";
      $("muteText").textContent = state.muted ? "Unmute" : "Mute mic";
      $("speakerText").textContent = state.speakerOff ? "Audio off" : "Audio on";
      $("muteBtn").classList.toggle("on", state.muted);
      $("speakerBtn").classList.toggle("on", state.speakerOff);
      $("volumeText").textContent = Math.round(state.volume * 100) + "%";
      if (state.mode !== "active") { $("portrait").classList.remove("talking"); wave.classList.remove("active"); }
    }
    function render() {
      const log = $("log");
      log.replaceChildren();
      const rows = [...state.lines, ...Array.from(state.partials, ([role, text]) => ({ role, text, partial: true }))];
      if (!rows.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Captions appear here.";
        log.append(empty);
        return;
      }
      for (const row of rows) {
        const line = document.createElement("div");
        line.className = "line " + (row.role === "assistant" ? "mike" : "you") + (row.partial ? " partial" : "");
        const who = document.createElement("b");
        who.textContent = row.role === "assistant" ? "Sarah" : "You";
        line.append(who, document.createTextNode(row.text));
        log.append(line);
      }
      log.scrollTop = log.scrollHeight;
    }
    function add(role, text, partial) {
      text = clip(text, 4000).trim();
      if (!text) return;
      if (partial) state.partials.set(role, text);
      else { state.partials.delete(role); state.lines.push({ role, text }); if (state.lines.length > 40) state.lines.shift(); }
      render();
    }
    function setVolume() {
      if (state.client?.setVolume) state.client.setVolume(state.speakerOff ? 0 : state.volume);
    }
    function explain(err) {
      const raw = String(err?.message || err?.error?.message || err || "Could not connect");
      if (/permission|notallowed|microphone/i.test(raw)) return "Allow the microphone, then try again.";
      return raw.slice(0, 180);
    }
    function readContext() {
      let context = window.MTS_CSR_CONTEXT;
      if (!context) {
        try { context = JSON.parse(sessionStorage.getItem("mts-csr-context") || "null"); } catch { context = null; }
      }
      if (!context || typeof context !== "object") return;
      const name = clip(context.name || "", 75);
      if (name) $("who").textContent = name;
    }
    readContext();
    window.addEventListener("mts:csr-context-ready", readContext);
    function openPage(message) {
      const calls = Array.isArray(message.toolCallList) ? message.toolCallList : [];
      for (const tool of calls) {
        if (tool?.function?.name !== "show_page") continue;
        let args = tool.function.arguments || {};
        try { if (typeof args === "string") args = JSON.parse(args); } catch { continue; }
        const route = pages[clip(args.page || args.pageId || args.id, 64).toLowerCase()];
        if (route) window.location.assign(route);
      }
    }
    async function client() {
      if (state.client) return state.client;
      const module = await import("https://esm.sh/@vapi-ai/web?bundle");
      const Agent = module.default;
      const agent = new Agent(PUBLIC_KEY);
      agent.on("call-start", () => {
        state.mode = "active"; state.muted = false; setError("");
        $("status").textContent = "Connected";
        state.startedAt = Date.now();
        state.timer = setInterval(() => {
          const sec = Math.floor((Date.now() - state.startedAt) / 1000);
          $("timer").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
        }, 300);
        paint();
      });
      agent.on("call-end", () => { state.mode = "idle"; clearInterval(state.timer); state.partials.clear(); $("status").textContent = "Your assistant is ready"; render(); paint(); });
      agent.on("speech-start", () => { if (state.mode === "active") { $("portrait").classList.add("talking"); wave.classList.add("active"); $("status").textContent = "Sarah is speaking"; } });
      agent.on("speech-end", () => { if (state.mode === "active") { $("portrait").classList.remove("talking"); wave.classList.remove("active"); $("status").textContent = state.muted ? "Microphone muted" : "Listening"; } });
      agent.on("volume-level", (level) => { if (state.mode === "active" && level > 0.03) wave.classList.add("active"); });
      agent.on("message", (message) => {
        if (!message) return;
        if (message.type === "transcript") add(message.role === "assistant" ? "assistant" : "user", message.transcript || "", message.transcriptType === "partial");
        else if (message.type === "tool-calls") openPage(message);
      });
      agent.on("error", (err) => { $("error").textContent = explain(err); if (state.mode === "connecting") { state.mode = "error"; clearInterval(state.timer); paint(); } });
      state.client = agent;
      setVolume();
      return agent;
    }
    function setError(text) { $("error").textContent = text || ""; }
    async function start() {
      state.mode = "connecting"; state.lines = []; state.partials.clear();
      $("timer").textContent = "00:00"; $("status").textContent = "Connecting"; setError(""); render(); paint();
      try {
        const agent = await client();
        if (state.mode !== "connecting") return;
        await agent.start(ASSISTANT_ID);
      } catch (err) {
        state.mode = "error"; $("status").textContent = "Could not connect"; setError(explain(err)); paint();
      }
    }
    function stop() {
      state.mode = "ending"; paint();
      try { state.client?.stop(); } catch (err) { setError(explain(err)); }
      setTimeout(() => { if (state.mode === "ending") { state.mode = "idle"; paint(); } }, 4000);
    }
    $("callBtn").addEventListener("click", () => { if (state.mode === "active" || state.mode === "connecting") stop(); else start(); });
    $("muteBtn").addEventListener("click", () => {
      if (!state.client || state.mode !== "active") return;
      state.muted = !state.muted;
      state.client.setMuted(state.muted);
      $("status").textContent = state.muted ? "Microphone muted" : "Listening";
      paint();
    });
    $("speakerBtn").addEventListener("click", () => { if (state.mode !== "active") return; state.speakerOff = !state.speakerOff; setVolume(); paint(); });
    $("volume").addEventListener("input", (event) => {
      state.volume = Number(event.target.value) / 100;
      state.speakerOff = state.volume === 0;
      setVolume();
      paint();
    });
    window.addEventListener("beforeunload", () => { if (state.mode === "active") state.client?.stop(); });
    paint();
  </script>
</body>
</html>
